# Same as production, but runs HfgPortal.Release.migrate() before starting the app.
services:
  app:
    extends:
      file: docker-compose.production.yml
      service: app
    environment:
      - INCLUDE_MIGRATIONS=true
    ports: !override
      - "4000:4000"
  hull-family-games-postgres-prod:
    extends:
      file: docker-compose.production.yml
      service: hull-family-games-postgres-prod
