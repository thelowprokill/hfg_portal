services:
  app:
    restart: always
    build:
      context: .
      dockerfile: ./docker/production/Dockerfile
    environment:
      - LOCATION=bnw
      - POSTGRES_HOST=hull-family-games-postgres-prod
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PORT=5432
    ports:
      - "4000:4000"
        #- "443:4000"
    env_file:
      - ./docker/production/.env
    image: hfg-portal-production
    depends_on:
      hull-family-games-postgres-prod:
        condition: service_healthy
  hull-family-games-postgres-prod:
    container_name: hull-family-games-postgres-prod
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=hfg_portal
      - PGDATA=/var/lib/postgresql/data/pgdata
    # Only POSTGRES_PASSWORD is needed from here.
    env_file:
      - ./docker/production/.env
    volumes:
      - ./db_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hfg_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
