services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/development/Dockerfile
    ports:
      - "4000:4000"
        #- "4000:4000"
    volumes:
      - .:/app
    depends_on:
      - hull-family-games-db
    environment:
      - LOCATION=bnw
    env_file:
      - "./docker/development/.env"
  hull-family-games-db:
    container_name: hull-family-games-db
    image: mysql:8.1
    environment:
      - MYSQL_ROOT_PASSWORD=sxkjad94
    command: --sql_mode="" --max_connections=200
    ports:
      - "13307:3306"
        #- "13307:3306"
    volumes:
      - hull-family-games-db-data:/var/lib/mysql
volumes:
  hull-family-games-db-data:
    driver: local
