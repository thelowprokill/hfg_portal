services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/development/Dockerfile
    ports:
      - "5000:4000"
        #- "4000:4000"
    volumes:
      - .:/app
    depends_on:
      - hull-family-games-db
      - hull-family-games-postgres
    environment:
      - LOCATION=bnw
    env_file:
      - "./docker/development/.env"
  hull-family-games-postgres:
    container_name: hull-family-games-postgres
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=sxkjad94
      - PGDATA=/var/lib/postgresql/data/pgdata
    # Fix data dir ownership/permissions on every start (e.g. after copying ./db between machines).
    entrypoint: ["sh", "-c", "chmod 755 /var/lib/postgresql/data; chown -R postgres:postgres $$PGDATA; chmod -R u+rwX,go-rwx $$PGDATA; exec docker-entrypoint.sh postgres"]
    ports:
      - "15432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
  # Kept around only so existing MySQL data can be migrated over; remove once migration is done.
  hull-family-games-db:
    container_name: hull-family-games-db
    image: mysql:8.1
    environment:
      - MYSQL_ROOT_PASSWORD=sxkjad94
    command: --sql_mode="" --max_connections=200
    ports:
      - "13307:3306"
        #- "13307:3306"
    volumes:
      - hull-family-games-db-data:/var/lib/mysql
volumes:
  hull-family-games-db-data:
    driver: local
